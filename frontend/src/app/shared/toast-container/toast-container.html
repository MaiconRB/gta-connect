<div
  class="fixed bottom-4 inset-x-0 z-20 flex flex-col items-center gap-2 px-4 pointer-events-none md:bottom-6"
  role="status"
  aria-live="polite"
>
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="pointer-events-auto w-full max-w-sm rounded-lg border px-4 py-2.5 text-sm shadow-xl flex items-center justify-between gap-3"
      [class.bg-red-950]="toast.variant === 'error'"
      [class.border-red-900]="toast.variant === 'error'"
      [class.text-red-300]="toast.variant === 'error'"
      [class.bg-neutral-900]="toast.variant !== 'error'"
      [class.border-neutral-800]="toast.variant !== 'error'"
      [class.text-cyan-300]="toast.variant === 'info'"
      [class.text-green-400]="toast.variant === 'success'"
    >
      <span>{{ toast.message }}</span>
      <button
        type="button"
        (click)="toastService.dismiss(toast.id)"
        [attr.aria-label]="'common.dismiss' | translate"
        class="text-neutral-500 hover:text-neutral-300 shrink-0"
      >
        ×
      </button>
    </div>
  }
</div>
