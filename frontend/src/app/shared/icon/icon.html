<svg
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.5"
  [class]="size() === 'sm' ? 'w-4 h-4' : 'w-5 h-5'"
>
  @switch (name()) {
    @case ('profile') {
      <circle cx="12" cy="8" r="3.5" />
      <path d="M4.5 20c1.5-4 4.5-6 7.5-6s6 2 7.5 6" stroke-linecap="round" />
    }
    @case ('search') {
      <circle cx="10.5" cy="10.5" r="6.5" />
      <path d="M20 20l-4.8-4.8" stroke-linecap="round" />
    }
    @case ('feed') {
      <rect x="3.5" y="3.5" width="7" height="7" rx="1.2" />
      <rect x="13.5" y="3.5" width="7" height="7" rx="1.2" />
      <rect x="3.5" y="13.5" width="7" height="7" rx="1.2" />
      <rect x="13.5" y="13.5" width="7" height="7" rx="1.2" />
    }
    @case ('connections') {
      <circle cx="8.5" cy="12" r="4.5" />
      <circle cx="15.5" cy="12" r="4.5" />
    }
    @case ('messages') {
      <path d="M4 5.5h16v10H9l-4 3.5v-3.5H4v-10z" stroke-linejoin="round" />
    }
    @case ('bell') {
      <path d="M6 9a6 6 0 1 1 12 0c0 4 1.5 5.5 1.5 5.5H4.5S6 13 6 9Z" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M10 18.5a2 2 0 0 0 4 0" stroke-linecap="round" />
    }
    @case ('shield') {
      <path d="M12 3.5l6.5 2.5v5c0 4.5-2.8 7.5-6.5 9.5-3.7-2-6.5-5-6.5-9.5v-5L12 3.5Z" stroke-linecap="round" stroke-linejoin="round" />
    }
    @case ('warning') {
      <path d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" stroke-linecap="round" stroke-linejoin="round" />
    }
    @case ('vault') {
      <rect x="4" y="4" width="16" height="16" rx="2" />
      <circle cx="12" cy="12" r="3.2" />
      <path d="M12 9v0.01" stroke-linecap="round" />
    }
    @case ('car') {
      <path d="M4 16v-3l2-4h9l3 4h2v3" stroke-linejoin="round" stroke-linecap="round" />
      <path d="M4 16h1.5m13 0H20" stroke-linecap="round" />
      <circle cx="7" cy="16" r="1.5" />
      <circle cx="17" cy="16" r="1.5" />
    }
    @case ('crosshair') {
      <circle cx="12" cy="12" r="7" />
      <path d="M12 2v4M12 18v4M2 12h4M18 12h4" stroke-linecap="round" />
    }
    @case ('mask') {
      <path d="M4 10c0-3 3.5-6 8-6s8 3 8 6c0 4-2 8-8 8s-8-4-8-8Z" />
      <circle cx="8.5" cy="10" r="1.1" fill="currentColor" stroke="none" />
      <circle cx="15.5" cy="10" r="1.1" fill="currentColor" stroke="none" />
    }
    @case ('users') {
      <circle cx="8" cy="8" r="3" />
      <path d="M2.5 20c1-3.5 3.2-5.5 5.5-5.5s4.5 2 5.5 5.5" stroke-linecap="round" />
      <circle cx="17" cy="9" r="2.3" />
      <path d="M14.5 20c0.6-2.6 2-4.2 3.7-4.6" stroke-linecap="round" />
    }
    @case ('map') {
      <path d="M9 4 4 6v14l5-2 6 2 5-2V4l-5 2-6-2Z" stroke-linejoin="round" />
      <path d="M9 4v14M15 6v14" />
    }
    @case ('briefcase') {
      <rect x="3.5" y="8" width="17" height="11" rx="1.5" />
      <path d="M8.5 8V6a1.5 1.5 0 0 1 1.5-1.5h4A1.5 1.5 0 0 1 15.5 6v2" />
      <path d="M3.5 13h17" />
    }
  }
</svg>
